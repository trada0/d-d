  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }

    display: flex; align-items: center; justify-content: center; gap: 15px;
    width: 100%; max-width: 440px; min-height: 100px;
    background: #FF0000; color: #fff; font-size: 32px; font-weight: bold;
    border: none; border-radius: 18px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.3); padding: 15px 20px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    /* Giảm độ trễ cảm ứng + tối ưu render */
    touch-action: manipulation;
    will-change: transform, opacity;
    transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    transform: translateZ(0);
  }
  .btn-youtube:active { transform: scale(0.97) translateZ(0); background: #cc0000; }
  /* Trạng thái khi vừa bấm → phản hồi tức thì, không bị "khựng" */

    background: #cc0000;
    opacity: 0.85;
    cursor: progress;
    pointer-events: none;
  }
  .btn-youtube svg { width: 55px; height: 55px; flex-shrink: 0; }
  #status {
    margin-top: 22px; font-size: 22px; color: #c62828;
    font-weight: bold; min-height: 30px;
  }
  .note {
    margin-top: 30px; max-width: 440px; font-size: 21px; line-height: 1.55;
    color: #222; background: #fff8e1; border: 3px solid #ffc107;
    border-radius: 14px; padding: 18px 20px;

ce_v2%3Dshare_panel%26share_app_id%3D1180%26share_enter_from%3D%26share_link_id%3D5C04B08A-D741-47B3-B978-5FD16142B01A%26share_region%3DVN%26social_share_type%3D15%26timestamp%3D1794183362%26tt_from%3Dcopy%26u_code%3DEHIB47291C9DEH%26ug_btm%3Db8727%252Cb6661%26unique_id%3Dminhanhxinhgai.1%26user_id%3D7446671710660117512%26utm_campaign%3Dclient_share%26utm_medium%3Dios%26utm_source%3Dcopy&refer=web',

  var btn      = document.getElementById('openBtn');
  var btnText  = document.getElementById('btnText');
  var statusEl = document.getElementById('status');

  function getStep() {
    var m = (location.hash || '').match(/step=(\d+)/);
    return m ? (parseInt(m[1], 10) || 0) : 0;
  }
  function setStep(s) {
    try { history.replaceState(null, '', '#step=' + s); }
    catch (e) { try { location.hash = 'step=' + s; } catch (e2) {} }
  }

  function setPending(s) {
    try {
      sessionStorage.setItem('pendingStep', String(s));
      sessionStorage.setItem('pendingStepTime', String(Date.now()));
    } catch (e) {}
  }
  function readPending() {
    try {
      var v = sessionStorage.getItem('pendingStep');
      var t = parseInt(sessionStorage.getItem('pendingStepTime') || '0', 10);
      if (v === null) return null;
      if (Date.now() - t > 600000) {
        sessionStorage.removeItem('pendingStep');
        sessionStorage.removeItem('pendingStepTime');
        return null;
      }
      return parseInt(v, 10);
    } catch (e) { return null; }
  }
  function clearPending() {
    try {
      sessionStorage.removeItem('pendingStep');
      sessionStorage.removeItem('pendingStepTime');
    } catch (e) {}
  }

  function goBlank() {
    try { document.title = ''; } catch (e) {}
    document.documentElement.style.background = '#fff';
    document.body.style.background = '#fff';
    document.body.innerHTML = '';
    try { history.replaceState(null, '', location.pathname + location.search); }
    catch (e) {}
  }

  function render() {
    var s = getStep();
    if (s >= 3) { goBlank(); return; }
    btnText.textContent = s === 0 ? 'MỞ YOUTUBE' : 'MỞ YOUTUBE (' + s + '/3)';
    statusEl.textContent = s === 0 ? 'Bấm để bắt đầu' : 'Đã mở ' + s + '/3 — bấm tiếp tục';
    btn.classList.remove('loading');
  }

  function applyPending() {
    var pending = readPending();
    if (pending !== null) {
      clearPending();
      if (pending > getStep()) setStep(pending);
    }
  }

  applyPending();
  render();

  window.addEventListener('pageshow', function () { applyPending(); render(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { applyPending(); render(); }
  });

  var lastClick = 0;
  var navigating = false;

  btn.addEventListener('click', function (e) {
    e.preventDefault();
    var now = Date.now();
    if (navigating || now - lastClick < 800) return;
    lastClick = now;

    var current = getStep();
    if (current >= 3) return;

    navigating = true;

    // 1) Phản hồi thị giác NGAY LẬP TỨC để không có cảm giác "khựng"
    btn.classList.add('loading');
    btnText.textContent = 'ĐANG MỞ...';
    statusEl.textContent = 'Vui lòng đợi...';

    // 2) Chờ trình duyệt vẽ xong trạng thái loading rồi mới điều hướng
    //    (double rAF: đảm bảo paint xảy ra trước khi trang bị thay thế)
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        try {
          setPending(current + 1);
          setStep(current + 1);
        } catch (err) {}

        // 3) Điều hướng cùng tab sang quảng cáo — mượt hơn trên mobile/FB in-app
        try {
          window.location.assign(ADS[current]);
        } catch (err) {
          navigating = false;
          btn.classList.remove('loading');
          render();
        }
      });
    });

    // Nếu vì lý do nào đó không điều hướng được, cho phép bấm lại sau 5s
    setTimeout(function () { navigating = false; }, 5000);
  });
})();
